name: shellcheck

on:
  push:
    branches: [main]
    paths:
      - "scripts/**/*.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "scripts/**/*.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck -x scripts/**/*.sh
