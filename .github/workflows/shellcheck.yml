name: shellcheck

on:
  push:
    branches: [main]
    paths:
      - "scripts/**/*.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "scripts/**/*.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        # find/xargs rather than scripts/**/*.sh: the runner's bash has
        # globstar off, so ** would only match one directory level.
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -x
